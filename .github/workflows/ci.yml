name: CI

on:
  pull_request:
  workflow_call:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historique complet : la version se calcule depuis git
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run android:sync
      - name: APK debug (installable pour tester la PR)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: L'APK contient le moteur de lecture OSD
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          for f in worker.min.js tesseract-core-lstm.wasm.js tesseract-core-simd-lstm.wasm.js tesseract-core-relaxedsimd-lstm.wasm.js eng.traineddata.bin; do
            unzip -l "$APK" | grep -q "assets/public/ocr/$f$" || { echo "::error::$f absent de l'APK"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: fpv-analytics-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
